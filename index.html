<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book a train ticket</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-4">
        <nav class="task-navigation d-flex flex-wrap justify-content-center gap-2 mb-3" aria-label="Assignments">
            <a class="btn btn-clear" href="index.html" aria-current="page">Задание 1</a>
            <a class="btn btn-clear" href="task2.html">Задание 2</a>
            <a class="btn btn-clear" href="task3.html">Задание 3</a>
        </nav>
        <section class="form-card mx-auto" aria-labelledby="page-title">
            <h1 id="page-title">Book a train ticket</h1>
            <form action="index.html" method="get" class="p-4 p-md-5">
                <fieldset class="mb-4">
                    <legend class="visually-hidden">Journey type</legend>
                    <div class="btn-group trip-type">
                        <input class="btn-check" type="radio" name="trip" id="one-way" value="one-way">
                        <label class="btn" for="one-way">One way</label>
                        <input class="btn-check" type="radio" name="trip" id="round-trip" value="round-trip">
                        <label class="btn" for="round-trip">Round trip</label>
                    </div>
                </fieldset>
                <div class="row g-3">
                <div class="col-12 col-md-6">
                    <div class="form-floating">
                        <input class="form-control" id="from" name="from" placeholder="Astana" required>
                        <label for="from">From</label>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="form-floating">
                        <input class="form-control" id="to" name="to" placeholder="Almaty" required>
                        <label for="to">To</label>
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <label for="departure" class="form-label">Departure</label>
                    <input type="date" class="form-control" id="departure" name="departure" required>
                </div>
                <div class="col-12 col-md-4">
                    <label for="return" class="form-label">Return</label>
                    <input type="date" class="form-control" id="return" name="return" >
                </div>
                <div class="col-12 col-md-4">
                    <label for="passengers" class="form-label">Passengers</label>
                    <select class="form-select" id="passengers" name="passengers" required>
                        <option value="">Choose…</option>
                        <option value="1">1 adult</option>
                        <option value="2">2 adults</option>
                        <option value="3">3 adults</option>
                        <option value="4">4 adults</option>
                        <option value="5">5 adults</option>
                        <option value="6">6 adults</option>
                    </select>
                </div>
                <fieldset class="col-12">
                    <legend class="form-label">Carriage class</legend>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="carriage-0" name="carriage" value="Seat" required>
                        <label class="form-check-label" for="carriage-0">Seat</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="carriage-1" name="carriage" value="Coupé" required>
                        <label class="form-check-label" for="carriage-1">Coupé</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="carriage-2" name="carriage" value="Sleeper" required>
                        <label class="form-check-label" for="carriage-2">Sleeper</label>
                    </div>
                </fieldset>
                <div class="col-12 col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <div class="input-group">
                        <span class="input-group-text" id="country-code">+7</span>
                        <input class="form-control" type="tel" id="phone" name="phone" placeholder="701 234 56 78" aria-describedby="country-code" required>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="col-12">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
                        <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="agreement" name="agreement" value="yes" required>
                        <label class="form-check-label" for="agreement">I agree with the carriage rules</label>
                        <div class="invalid-feedback">You must agree before submitting.</div>
                    </div>
                </div>
                <div class="col-12 actions d-flex gap-2 justify-content-md-end mt-4">
                    <button class="btn btn-clear" type="reset">Clear</button>
                    <button class="btn btn-find" type="submit">Find trains</button>
                </div>
                </div>
            </form>
        </section>

        <p class="text-center small mt-2">Kurmashev Damir · IT-2511</p>
    </main>
</body>
</html>
