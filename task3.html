<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserve a table</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-4">
        <nav class="task-navigation d-flex flex-wrap justify-content-center gap-2 mb-3" aria-label="Assignments">
            <a class="btn btn-clear" href="index.html">Задание 1</a>
            <a class="btn btn-clear" href="task2.html">Задание 2</a>
            <a class="btn btn-clear" href="task3.html" aria-current="page">Задание 3</a>
        </nav>
        <section class="form-card mx-auto" aria-labelledby="page-title">
            <h1 id="page-title">Reserve a table</h1>
            <form action="task3.html" method="get" class="p-4">
                <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="name" class="form-label">Your name</label>
                    <input type="text" class="form-control" id="name" name="name" required autocomplete="name">
                </div>
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                </div>
                <div class="col-12 col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required autocomplete="tel">
                </div>
                <div class="col-12 col-md-6">
                    <label for="guests" class="form-label">Guests</label>
                    <input type="number" class="form-control" id="guests" name="guests" required min="1" step="1">
                </div>
                <div class="col-12 col-md-6">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" name="date" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="meal" class="form-label">Meal</label>
                    <select class="form-select" id="meal" name="meal" required>
                        <option value="">Choose…</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                    </select>
                </div>
                <fieldset class="col-12">
                    <legend class="form-label">Seating</legend>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="seating-0" name="seating" value="Inside" required>
                        <label class="form-check-label" for="seating-0">Inside</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="seating-1" name="seating" value="Terrace" required>
                        <label class="form-check-label" for="seating-1">Terrace</label>
                    </div>
                </fieldset>
                <div class="col-12">
                    <label for="comments" class="form-label">Comments</label>
                    <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="terms" name="terms" value="yes" required>
                        <label class="form-check-label" for="terms">I agree to the terms</label>
                        <div class="invalid-feedback">You must agree before submitting.</div>
                    </div>
                </div>
                <div class="col-12"><button class="btn btn-find" type="submit">Reserve</button></div>
                </div>
            </form>
        </section>

        <p class="text-center small mt-2">Kurmashev Damir · IT-2511</p>
    </main>
</body>
</html>
